<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content= "width=device-width, initial-scale=1.0">
    <title>ExpenseWise Solutions</title>
     <link rel="icon" type="image/png" href="image.png"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

      .btn-start {
      background-color: #1abc9c; /* green */
      color: #fff;
      font-weight: bold;
      padding: 12px 30px;
      border-radius: 30px;
      transition: all 0.3s ease;
      display: inline-block;
      margin-top: 20px;
    }
    .btn-start:hover {
      background-color: #16a085; /* darker green */
      color: #fff;
    }
    html {scroll-behavior:smooth;} 
    /* Navigation bae */
    .navbar {
        background-color: #2c3e50;
    }
    .nav-link {
        color: #f1c40f !important;
        font-weight: bold;
    }
    .nav-link:hover {
        color: #1abc9c !important;
    }

    /*Home section */
    .home-section {
        background: url('finance-bg.png') no-repeat center center/cover;
        height: 100vh;
        color: #fff;
        position: relative;
    }
      .home-section::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); /* overlay for readability */
    }
    .home-section .container {
      position: relative;
      z-index: 2;
    }
    .business-name {
      font-size: 3.5rem;
      font-weight: 700;
      font-family: 'Segoe UI', sans-serif;
    }
    .tagline {
      font-size: 1.5rem;
      margin: 20px 0;
    }
    /* Animation setup */

   .fade-in {
   opacity: 0;
   transform: translateY(30px);
   transition: opacity 1s ease-out, transform 1s ease-out;
   }

   .fade-in.visible {
   opacity: 1;
   transform: translateY(0);
   }

  </style>
</head>
<body>


  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#index.html">Expense Wise Solutions</a>

      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="qualifications.html">Qualifications</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        

        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section id="home" class="home-section d-flex align-items-center">
    <div class="container text-center">
      <h1 class="business-name">Expense Wise Solutions</h1>
      <p class="tagline">Track smarter, spend wiser.</p>
      <a href="start-tracking.html" class="btn btn-start">Start Tracking</a>

    </div>
  </section>
<script>
  const sections = document.querySelectorAll('section');

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.2 });

  sections.forEach(section => {
    section.classList.add('fade-in');
    observer.observe(section);
  });
</script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  // Get the current page filename
  const currentPage = window.location.pathname.split("/").pop();

  // Loop through all nav links
  document.querySelectorAll(".nav-link").forEach(link => {
    if (link.getAttribute("href") === currentPage) {
      link.classList.add("active");   // highlight current page
    } else {
      link.classList.remove("active"); // remove from others
    }
  });
</script>

</body>
</html>
